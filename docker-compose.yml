services:
  mysql:
    image: mysql:8.0
    container_name: image_platform_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: image_platform
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "app_user", "-papp_password", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7.2-alpine
    container_name: image_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data: